# Permite sobreescribir propiedades localmente sin subir secretos a Git
spring.config.import=optional:classpath:application-local.properties

# Base de Datos (Oracle Autonomous Database Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@alejandriabd2026_high?TNS_ADMIN=C:/oracle/Wallet_AlejandriaBD2026}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alejandria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Seguridad y Autenticacion
jwt.secret=${JWT_SECRET:alejandria-dev-jwt-secret-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Correo transaccional (console | smtp | resend)
app.mail.provider=${APP_MAIL_PROVIDER:console}
app.mail.from=${APP_MAIL_FROM:Alejandria UPC <noreply@alejandria.local>}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.resend-url=${RESEND_API_URL:https://api.resend.com/emails}

# Configuracion SMTP (usada cuando app.mail.provider=smtp)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verificacion de correo por OTP
app.verification.code-length=6
app.verification.expiration-minutes=15
app.verification.max-attempts=5
app.verification.resend-cooldown-seconds=60
app.verification.hash-secret=${VERIFICATION_HASH_SECRET:alejandria-dev-verification-secret-change-in-prod}
app.verification.unverified-cleanup-hours=48

# Analiticas e IA
analytics.salt=${ANALYTICS_SALT:alejandria_analytics_salt_key_2026}
ia.api-key=${IA_API_KEY:}
ia.timeout=${IA_TIMEOUT:60000}
ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=
ai.api.key=${AI_API_KEY:}

# Gestion de Archivos
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:25MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_SIZE:25MB}
