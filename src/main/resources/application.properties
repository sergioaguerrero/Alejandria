# Puerto dinamico para despliegue en la nube (Render/Koyeb inyectan PORT; local usa 8080)
server.port=${PORT:8080}

# Permite sobreescribir propiedades localmente sin subir secretos a Git ni empaquetarlos en el JAR
spring.config.import=optional:file:./application-local.properties,optional:file:./src/main/resources/application-local.properties,optional:classpath:application-local.properties

# Base de Datos (Oracle Autonomous Database Cloud)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@alejandriabd2026_tp?TNS_ADMIN=C:/oracle/Wallet_AlejandriaBD2026}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:alejandria}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA & Hibernate (Database First: valida contra el esquema ya creado en Oracle)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=30
spring.jpa.properties.hibernate.jdbc.fetch_size=50

# Seguridad y Autenticacion
jwt.secret=${JWT_SECRET:alejandria-dev-jwt-secret-change-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Correo transaccional (console | smtp | resend | brevo | gas)
app.mail.provider=${APP_MAIL_PROVIDER:console}
app.mail.from=${APP_MAIL_FROM:Alejandria UPC <noreply@alejandria.local>}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.resend-url=${RESEND_API_URL:https://api.resend.com/emails}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
app.mail.gas-url=${GAS_WEBHOOK_URL:}

# Configuracion SMTP (usada cuando app.mail.provider=smtp)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Verificacion de correo por OTP
app.verification.code-length=6
app.verification.expiration-minutes=15
app.verification.max-attempts=5
app.verification.resend-cooldown-seconds=60
app.verification.hash-secret=${VERIFICATION_HASH_SECRET:alejandria-dev-verification-secret-change-in-prod}
app.verification.unverified-cleanup-hours=48

# Analiticas e IA
analytics.salt=${ANALYTICS_SALT:alejandria_analytics_salt_key_2026}
ia.api-key=${IA_API_KEY:}
ia.timeout=${IA_TIMEOUT:60000}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=}
ai.api.key=${AI_API_KEY:${IA_API_KEY:}}
ai.daily-limit=${AI_DAILY_LIMIT:5}

# Gestion de Archivos y Limites de Hilos Tomcat (optimizado para 512 MB RAM en Render)
spring.servlet.multipart.max-file-size=${FILE_MAX_SIZE:25MB}
spring.servlet.multipart.max-request-size=${FILE_MAX_REQUEST_SIZE:25MB}
spring.servlet.multipart.file-size-threshold=512KB
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=4

# Compresion HTTP (reduce ~75% el tamano de respuestas JSON y acelera cargas en Render)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# Pool de Conexiones HikariCP optimizado para Oracle Cloud + Render Free (512 MB RAM)
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties.oracle.jdbc.defaultRowPrefetch=50

# Caches en memoria para reducir viajes repetidos a Oracle Cloud
app.jwt.cache-ttl-seconds=${JWT_CACHE_TTL_SECONDS:15}
app.catalog.cache-ttl-seconds=${CATALOG_CACHE_TTL_SECONDS:300}
