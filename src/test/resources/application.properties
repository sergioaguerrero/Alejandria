spring.datasource.url=jdbc:h2:mem:alejandria_test;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.mail.provider=console
app.mail.from=Alejandria Test <noreply@alejandria.test>
app.verification.code-length=6
app.verification.expiration-minutes=15
app.verification.max-attempts=5
app.verification.resend-cooldown-seconds=60
app.verification.hash-secret=test-verification-secret

ai.api.url=https://example.invalid/gemini
ai.api.key=test-ai-key
analytics.salt=test-analytics-salt

ai.daily-limit=5
